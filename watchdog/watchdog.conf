# =============================================================================
# Technopoliss watchdog configuration (OPTIONAL overrides).
#
# The watchdog runs fine with zero config — sensible defaults are baked into
# technopoliss-watchdog.sh. Uncomment + set values below only to override a
# default or to enable alerting.
# =============================================================================

# --- Alerting (optional — enable one or both) ---------------------------------
# Telegram bot: create a bot with @BotFather, then send it a message and get
# your chat id from https://api.telegram.org/bot<TOKEN>/getUpdates
#TELEGRAM_TOKEN=
#TELEGRAM_CHAT_ID=

# Generic JSON webhook (any HTTPS endpoint):
#ALERT_WEBHOOK=

# --- Stack identity (usually correct; change only if the host/ports differ) ----
#VPS_HOST=srv1732329.hstgr.cloud
#PUBLIC_URL=https://srv1732329.hstgr.cloud
#BACKEND_URL=http://127.0.0.1:9090
#OPENWA_URL=http://127.0.0.1:2786
#COMPOSE_DIR=/opt/technopoliss
#ENV_FILE=/opt/technopoliss/backend/.env
#DB_IN_CONTAINER=/app/backend/data/vernika.db

# --- Service / container names (match docker-compose.yml) ----------------------
#SVC_BACKEND=technopoliss
#SVC_OPENWA=openwa
#SVC_CADDY=caddy
#CT_BACKEND=technopoliss-vernika
#CT_OPENWA=openwa-api
#CT_CADDY=technopoliss-caddy

# --- Tuning ---------------------------------------------------------------------
#DISK_WARN_PCT=85            # trigger disk prune + alert above this % of /
#MAX_RESTARTS_PER_10M=3      # restart-storm guard: max restarts per window
#RESTART_WINDOW_SEC=600      # restart-cooldown window (10 min)
#LOG_FILE=/var/log/technopoliss-watchdog.log
#STATE_DIR=/var/lib/technopoliss-watchdog
